name: Daily Snapshot

on:
  schedule:
    # Run every day at 11:59 PM UTC (adjust timezone as needed)
    - cron: '59 23 * * *'
  workflow_dispatch:
    inputs:
      thumbnail_only:
        description: Check for a thumbnail update without saving a daily snapshot
        type: boolean
        default: false

permissions:
  contents: write  # Needed to commit thumbnail back to repo

concurrency:
  group: daily-board-snapshot
  cancel-in-progress: false

jobs:
  create-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Daily Snapshot via Supabase RPC
        if: github.event_name != 'workflow_dispatch' || !inputs.thumbnail_only
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Creating snapshot for date: $TODAY"
          
          # Call Supabase RPC function directly
          response=$(curl -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/create_daily_snapshot" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response body: $body"
          echo "HTTP status: $http_code"
          
          if [ "$http_code" -ne 200 ] && [ "$http_code" -ne 204 ]; then
            echo "❌ Error: Snapshot creation failed with status $http_code"
            exit 1
          fi
          
          echo "✅ Snapshot created successfully!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check thumbnail inputs
        id: thumbnail
        env:
          FORCE_THUMBNAIL: ${{ github.event_name == 'workflow_dispatch' && !inputs.thumbnail_only }}
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          digest=$(node scripts/board-thumbnail-fingerprint.mjs)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE_THUMBNAIL" == true ||
                ! -s public/assets/images/thumb.png ||
                ! -s public/assets/images/thumb.jpg ||
                ! -f .github/board-thumbnail.sha256 ||
                "$digest" != "$(cat .github/board-thumbnail.sha256)" ]]; then
            echo "capture=true" >> "$GITHUB_OUTPUT"
          else
            echo "Board inputs match the previous capture."
          fi

      - name: Install Puppeteer
        if: steps.thumbnail.outputs.capture == 'true'
        # Keep the locked Supabase dependencies in the checkout intact for the second fingerprint.
        run: npm install --prefix "$RUNNER_TEMP/corkboard-thumbnail" --no-save --package-lock=false puppeteer@25.18.1

      - name: Generate Thumbnail Screenshot
        if: steps.thumbnail.outputs.capture == 'true'
        env:
          SITE_URL: https://onethreenine.net
        run: |
          node << 'EOF'
          const path = require('path');
          const puppeteer = require(path.join(process.env.RUNNER_TEMP, 'corkboard-thumbnail', 'node_modules', 'puppeteer'));
          
          (async () => {
            console.log('Launching browser...');
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            
            const page = await browser.newPage();
            
            // Set viewport to match the board's 16:9 aspect ratio
            // Using 1920x1080 as the capture size, will be the final image size
            await page.setViewport({ width: 1920, height: 1080 });
            
            console.log('Navigating to site...');
            await page.goto(process.env.SITE_URL, { 
              waitUntil: 'networkidle2',
              timeout: 60000 
            });
            
            // Wait for the board to fully render (wait for items to load)
            console.log('Waiting for board to render...');
            await page.waitForSelector('[data-corkboard]', { timeout: 30000 });
            
            // Give extra time for images and content to load
            await new Promise(resolve => setTimeout(resolve, 5000));
            
            await page.waitForFunction(() => [...document.querySelectorAll('[data-corkboard] img')]
              .every(image => image.complete));

            // Hide any UI elements (toolbar, etc.) for clean screenshot
            await page.evaluate(() => {
              // Hide toolbar and any overlays
              const toolbar = document.querySelector('[data-toolbar]');
              if (toolbar) toolbar.style.display = 'none';
              
              // Hide any modals or dialogs
              const modals = document.querySelectorAll('[role="dialog"]');
              modals.forEach(m => m.style.display = 'none');
              
              // Hide login overlay if visible
              const loginOverlay = document.querySelector('.fixed.inset-0.z-50');
              if (loginOverlay) loginOverlay.style.display = 'none';
            });
            
            // Take screenshot
            console.log('Taking screenshot...');
            const screenshotPath = path.join(process.cwd(), 'public', 'assets', 'images', 'thumb.png');
            
            await page.screenshot({
              path: screenshotPath,
              type: 'png',
              fullPage: false
            });
            
            console.log(`✅ Thumbnail saved to: ${screenshotPath}`);
            
            // Also save as jpg for compatibility
            const jpgPath = path.join(process.cwd(), 'public', 'assets', 'images', 'thumb.jpg');
            await page.screenshot({
              path: jpgPath,
              type: 'jpeg',
              quality: 90,
              fullPage: false
            });
            
            console.log(`✅ Thumbnail (JPG) saved to: ${jpgPath}`);
            
            await browser.close();
            console.log('Browser closed.');
          })().catch(error => { console.error(error); process.exit(1); });
          EOF

      - name: Commit and push thumbnail
        if: steps.thumbnail.outputs.capture == 'true'
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          CAPTURE_DIGEST: ${{ steps.thumbnail.outputs.digest }}
        run: |
          current_digest=$(node scripts/board-thumbnail-fingerprint.mjs)
          if [[ "$current_digest" != "$CAPTURE_DIGEST" ]]; then
            echo "Board changed during capture. Keeping the previous thumbnail."
            exit 0
          fi

          printf '%s\n' "$CAPTURE_DIGEST" > .github/board-thumbnail.sha256
          git add public/assets/images/thumb.png public/assets/images/thumb.jpg .github/board-thumbnail.sha256
          if git diff --cached --quiet; then
            echo "Thumbnail already current."
            exit 0
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "📸 Update daily thumbnail - $(date -u +%Y-%m-%d)"
          git push
